<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>极简测时 · Time Study Lite</title>
<style>
:root{font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}main{max-width:520px;margin:auto;padding:20px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{font-size:23px;margin:0}.sub{color:#718096;font-size:13px;margin:6px 0 0}.tiny{border:1px solid #d8dfe8;background:white;border-radius:10px;padding:10px;color:#526174;font-weight:600}.panel{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #233a5110}.setting{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lbl{display:block;color:#526174;font-size:14px;font-weight:650;margin-bottom:8px}select{width:100%;height:49px;background:#f5f7fa;border:1px solid #e1e6ee;border-radius:12px;padding:0 10px;font-weight:700;color:#1c2e47}.progress{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}.muted{color:#66768b;font-size:14px;font-weight:500}.bar{background:#e8eef4;border-radius:30px;height:9px;overflow:hidden;margin-top:13px}.fill{height:100%;width:0;background:#1b83db;transition:width .18s}.center{text-align:center;padding-top:15px;padding-bottom:15px}.kicker{font-size:16px;color:#597083;font-weight:650}.unit{font-size:34px;font-weight:850;margin:12px 0 5px}.clock{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-2px;font-size:clamp(47px,12.2vw,69px);font-weight:800;margin:12px 0 14px}.mainbtn{display:flex;align-items:center;justify-content:center;width:min(90vw,440px);height:min(90vw,440px);aspect-ratio:1;margin:4px auto 0;padding:30px;border:0;border-radius:50%;background:#087cde;color:white;font-size:clamp(30px,8vw,43px);line-height:1.25;font-weight:850;box-shadow:0 10px 25px #087cde35;user-select:none;-webkit-tap-highlight-color:transparent}.mainbtn:active{transform:scale(.975)}.mainbtn.running{background:#078b62;box-shadow:0 7px 15px #078b6229}.mainbtn.done{background:#49647f}.discard{margin-top:14px;border:1px solid #f0c7c1;background:#fff7f6;color:#b43e31;width:100%;border-radius:14px;min-height:57px;font-weight:700;font-size:18px}.hint{font-size:13px;color:#728196;margin:13px 0 0;min-height:19px}.stats{display:flex;justify-content:space-between;gap:15px;align-items:end}.number{font-size:29px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}.unitrow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #edf0f4;padding:11px 0;font-size:15px}.unitrow:last-child{border:0}.avg{font-weight:800;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.action{height:55px;border:1px solid #d8dfe8;border-radius:12px;background:white;font-weight:700;color:#26374a}.action.primary{background:#202e46;color:white;border:0}.notice{margin:12px 0;color:#738095;font-size:12px;line-height:1.5}.status{font-weight:700;color:#0869b6;font-size:13px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#21334d;color:white;border-radius:12px;box-shadow:0 8px 20px #0002;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:2}.overlay{position:fixed;inset:0;background:#111a2b88;display:none;align-items:center;justify-content:center;padding:20px;z-index:4}.dialog{background:white;max-width:370px;width:100%;padding:23px;border-radius:18px}.dialog h2{margin:0 0 8px;font-size:20px}.dialog p{color:#607086;line-height:1.6}.dialogBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialogBtns button{border-radius:10px;min-height:48px;border:1px solid #d8dfe8;background:white;font-weight:700}.dialogBtns .danger{background:#b83d31;color:white;border:0}#reportPanel{display:none}.help{margin-top:8px;font-size:12px;color:#718096}@media(min-width:530px){main{padding-top:32px}}
</style>
</head>
<body><main>
<header class="top"><div><h1>极简测时</h1><p class="sub">Time Study Lite · 10 组测量</p></div><button class="tiny" id="reset">重新测量</button></header>
<section class="panel setting"><label><span class="lbl">工作单元数量</span><select id="count" aria-label="工作单元数量"></select></label><label><span class="lbl">测时方式</span><select id="mode"><option value="continuous">连续测时</option><option value="manual">分次测时</option></select></label></section>
<section class="panel"><div class="progress"><span id="round">第 1 / 10 组</span><span class="muted" id="completed">已完成 0 组</span></div><div class="bar"><div class="fill" id="progress"></div></div></section>
<section class="panel center"><div class="kicker" id="stateText">准备开始</div><div class="unit" id="unit">工作单元 1</div><div class="clock" id="clock">00:00.00</div><button class="mainbtn" id="mainButton">开始测时</button><button class="discard" id="discard" disabled>作废本组 · 重新测</button><p class="hint" id="hint">点击开始，完成当前单元时再点击一次</p></section>
<section class="panel"><div class="stats"><div><span class="muted">工位平均总时间</span><div class="number" id="total">--</div></div><div class="status" id="summary">还没有测量数据</div></div><div id="averages" style="margin-top:12px"></div></section>
<div class="actions"><button class="action primary" id="copy">一键复制结果</button></div><p class="notice">每个单元完成 10 组后，自动去掉 1 个最大值和 1 个最小值，计算其余 8 组平均时间。不到 3 组时按现有数据计算普通平均值。数据仅保存在当前浏览器。</p>
<section id="reportPanel" class="panel"><div class="lbl">复制不成功？可长按下面的文字手动复制</div><textarea id="reportText" readonly style="width:100%;min-height:180px;border:1px solid #ddd;border-radius:8px;padding:10px"></textarea></section>
</main><div id="toast" role="status"></div>
<div id="modal" class="overlay" role="dialog" aria-modal="true"><div class="dialog"><h2 id="modalTitle">确认作废？</h2><p id="modalMessage"></p><div class="dialogBtns"><button id="cancelModal">取消</button><button class="danger" id="confirmModal">确认作废</button></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),TARGET=10,STORE='TIME_STUDY_LITE_CN_V1';
let s={count:3,mode:'continuous',rows:[],round:0,step:0,running:false,finished:false};
let lastTick=0,shown=0,raf=null,confirmAction=null;
for(let n=1;n<=10;n++)$('count').add(new Option(n+' 个',n));
function fresh(count=s.count,mode=s.mode){return {count,mode,rows:[],round:0,step:0,running:false,finished:false};}
function save(){try{localStorage.setItem(STORE,JSON.stringify({...s,running:false}));}catch(e){}}
function load(){try{let old=JSON.parse(localStorage.getItem(STORE));if(old&&Number.isInteger(old.count)&&old.count>=1&&old.count<=10&&['continuous','manual'].includes(old.mode)&&Array.isArray(old.rows)){s={...fresh(old.count,old.mode),rows:old.rows.filter(row=>Array.isArray(row)&&row.length===old.count&&row.every(v=>typeof v==='number'&&Number.isFinite(v)&&v>=0)).slice(0,TARGET)};s.round=s.rows.length;s.finished=s.rows.length===TARGET;}}catch(e){} }
let draft=[];
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,1900)}
function clock(ms){const v=Math.max(0,ms);let mm=Math.floor(v/60000),ss=Math.floor(v/1000)%60,hs=Math.floor(v%1000/10);return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(hs).padStart(2,'0')}`}
function elapsed(){return s.running?performance.now()-lastTick:shown}
function paintClock(){if(!s.running)return;$('clock').textContent=clock(elapsed());raf=requestAnimationFrame(paintClock)}
function stopClock(){s.running=false;if(raf)cancelAnimationFrame(raf);raf=null;shown=0;$('clock').textContent='00:00.00'}
function stat(values){if(!values.length)return null;let a=values.slice().sort((x,y)=>x-y);if(a.length>=3)a=a.slice(1,-1);return a.reduce((x,y)=>x+y,0)/a.length;}
function averages(){return Array.from({length:s.count},(_,i)=>stat(s.rows.map(row=>row[i])))}
function render(){
 $('count').value=s.count;$('mode').value=s.mode;let n=s.rows.length;
 $('round').textContent=s.finished?'10 / 10 组已完成':`第 ${n+1} / ${TARGET} 组`;
 $('completed').textContent=`已完成 ${n} 组`;$('progress').style.width=n/TARGET*100+'%';
 $('count').disabled=s.running||draft.length>0||n>0;$('mode').disabled=$('count').disabled;
 
 // 检查是否可作废：1.正在进行中；2.分次测时或全部完成时，刚测完一组处于停顿状态
 let canDiscard = s.running || draft.length > 0 || (n > 0 && !s.running && draft.length === 0 && (s.mode === 'manual' || s.finished));
 $('discard').disabled = !canDiscard;
 if (!s.running && draft.length === 0 && n > 0 && (s.mode === 'manual' || s.finished)) {
   $('discard').textContent = s.finished ? `作废第 ${n} 组（最后一组）` : `作废刚才完成的第 ${n} 组`;
 } else {
   $('discard').textContent = '作废本组 · 重新测';
 }

 $('mainButton').classList.toggle('running',s.running);$('mainButton').classList.toggle('done',s.finished);
 if(s.finished){$('stateText').textContent='全部完成';$('unit').textContent='10 组测量完成';$('mainButton').textContent='测量完成';$('mainButton').disabled=true;$('hint').textContent='可复制结果，或点击右上角重新测量';}
 else if(s.running){$('stateText').textContent=`正在测量 · 第 ${n+1} 组`;$('unit').textContent=`工作单元 ${s.step+1}`;$('mainButton').textContent=s.step===s.count-1?'完成本组':'完成此单元';$('mainButton').disabled=false;$('hint').textContent='当前动作完成时，点击上面的蓝/绿按钮';}
 else{$('stateText').textContent='准备开始';$('unit').textContent='工作单元 1';$('mainButton').textContent=n===0?'开始测时':`开始第 ${n+1} 组`;$('mainButton').disabled=false;$('hint').textContent=s.mode==='continuous'?'开始后自动连续测完 10 组':'每完成一组后，需要再次点击开始';}
 let avgs=averages(),total=avgs.every(v=>v!==null)?avgs.reduce((x,y)=>x+y,0):null;
 $('total').textContent=total===null?'--':total.toFixed(2)+' s';$('summary').textContent=n?`${n} 组有效数据`:'还没有测量数据';
 $('averages').innerHTML=avgs.map((v,i)=>`<div class="unitrow"><span>工作单元 ${i+1}</span><span class="avg">${v===null?'--':v.toFixed(2)+' s'}</span></div>`).join('');
}
function start(){s.running=true;lastTick=performance.now();shown=0;paintClock();render();}
function next(){const duration=performance.now()-lastTick;draft.push(Math.round(duration/10)/100);if(draft.length<s.count){s.step++;lastTick=performance.now();render();return;}
 s.rows.push(draft);draft=[];s.step=0;s.round=s.rows.length;save();if(s.round===TARGET){stopClock();s.finished=true;save();render();toast('10 组全部完成');return;}
 if(s.mode==='manual'){stopClock();render();toast(`第 ${s.round} 组完成`);return;}
 lastTick=performance.now();render();toast(`第 ${s.round} 组完成，继续下一组`);
}
$('mainButton').onclick=()=>{if(s.finished)return;if(!s.running)start();else next();};
function ask(title,message,action){$('modalTitle').textContent=title;$('modalMessage').textContent=message;confirmAction=action;$('modal').style.display='flex'}
$('cancelModal').onclick=()=>$('modal').style.display='none';
$('confirmModal').onclick=()=>{$('modal').style.display='none';if(confirmAction)confirmAction();confirmAction=null};

$('discard').onclick=()=>{
  let canDiscard = s.running || draft.length > 0 || (s.rows.length > 0 && !s.running && draft.length === 0 && (s.mode === 'manual' || s.finished));
  if(!canDiscard) return;

  if(s.running || draft.length > 0){
    ask('作废当前组？',`第 ${s.rows.length+1} 组尚未完成的数据将清空，之前已完成的 ${s.rows.length} 组会保留。`,()=>{stopClock();draft=[];s.step=0;render();toast('本组已作废，点击重新开始');});
  } else {
    let lastRound = s.rows.length;
    ask('作废刚完成的组？', `将作废刚才完成的第 ${lastRound} 组数据，操作后可重新测量该组。`, ()=>{
      s.rows.pop();
      s.round = s.rows.length;
      s.step = 0;
      s.finished = false;
      save();
      render();
      toast(`第 ${lastRound} 组已作废`);
    });
  }
};

$('reset').onclick=()=>ask('重新测量？','本次全部数据将清空，不能恢复。',()=>{stopClock();s=fresh();draft=[];save();render();toast('已清空，准备测量');});
function changeSetting(){s=fresh(Number($('count').value),$('mode').value);draft=[];save();render();}
$('count').onchange=changeSetting;$('mode').onchange=changeSetting;
function report(){const avgs=averages();const fmt=v=>v===null?'--':v.toFixed(2);return [`【Time Study｜${s.rows.length}/${TARGET} 组】`,`工作单元：${s.count} 个`,...avgs.map((v,i)=>`${i+1}. ${fmt(v)}s`),`总时间：${avgs.every(v=>v!==null)?fmt(avgs.reduce((x,y)=>x+y,0)):'--'}s`,'',...s.rows.map((row,i)=>`第${i+1}组：${row.map(fmt).join(' / ')}`)].join('\n')}
$('copy').onclick=async()=>{if(!s.rows.length){toast('请先完成至少 1 组');return;}let t=report();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}else{let el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.left='0';el.style.top='0';el.style.opacity='0';document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw Error('Copy denied');el.remove();}toast('已复制，可粘贴到微信');$('reportPanel').style.display='none'}catch(e){$('reportText').value=t;$('reportPanel').style.display='block';toast('请长按下方文本复制')}};
load();render();
</script></body></html>
